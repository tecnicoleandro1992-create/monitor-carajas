name: Atualizar site

on:
  push:
    branches: [main]
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  site:
    # Só comentários do dono do repositório na issue "Coletas" contam.
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.comment.user.login == github.repository_owner &&
       startsWith(github.event.issue.title, 'Coletas') &&
       contains(github.event.comment.body, '<!--coleta'))
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Aplicar coleta do comentário
        if: github.event_name == 'issue_comment'
        env:
          CORPO: ${{ github.event.comment.body }}
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$CORPO" > /tmp/comentario.txt
          python3 coleta/aplicar.py /tmp/comentario.txt
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "Coleta $(python3 -c "import json;print(json.load(open('data/coletas.json'))[-1]['coleta_id'])")"
            git push
          fi
          gh api -X DELETE "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}" || true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
